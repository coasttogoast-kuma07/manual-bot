<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>読書記録</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f7f0;
  --surface: #ffffff;
  --primary: #2d7a4f;
  --primary-light: #e6f4ec;
  --primary-mid: #c3e4ce;
  --accent: #f59e0b;
  --accent-light: #fef3c7;
  --text: #1a2e1a;
  --text-sub: #5a7060;
  --shadow: 0 4px 24px rgba(45,122,79,0.10);
  --radius: 16px;
  --status-owned: #3b82f6;
  --status-owned-bg: #eff6ff;
  --status-reading: #f59e0b;
  --status-reading-bg: #fffbeb;
  --status-finished: #10b981;
  --status-finished-bg: #ecfdf5;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  padding-bottom: 40px;
}

/* ヘッダー */
.header {
  width: 100%;
  max-width: 720px;
  background: var(--primary);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 14px;
  box-shadow: 0 4px 20px rgba(45,122,79,0.25);
  display: flex;
  align-items: center;
  gap: 14px;
  color: white;
}

.header-icon {
  font-size: 32px;
  flex-shrink: 0;
}

.header-title {
  font-family: 'M PLUS Rounded 1c', sans-serif;
  font-size: 20px;
  font-weight: 700;
}

.header-sub {
  font-size: 12px;
  opacity: 0.8;
  margin-top: 2px;
}

.header-stats {
  margin-left: auto;
  text-align: right;
  flex-shrink: 0;
}

.header-stats .stat-num {
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
}

.header-stats .stat-label {
  font-size: 11px;
  opacity: 0.8;
}

/* タブ */
.tabs {
  width: 100%;
  max-width: 720px;
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.tab {
  flex: 1;
  padding: 12px;
  background: var(--surface);
  border: 2px solid transparent;
  border-radius: 12px;
  font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  color: var(--text-sub);
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.tab:hover { background: var(--primary-light); color: var(--primary); }
.tab.active {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
}

/* メインカード */
.card {
  width: 100%;
  max-width: 720px;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
}

/* ===== 追加タブ ===== */
.isbn-section {
  margin-bottom: 20px;
}

.isbn-section label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sub);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.isbn-row {
  display: flex;
  gap: 10px;
  align-items: center;
}

.isbn-input {
  flex: 1;
  border: 2px solid #d1e8d9;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 18px;
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text);
  outline: none;
  letter-spacing: 0.1em;
  transition: border-color 0.2s;
  background: #f8fdf9;
}

.isbn-input:focus { border-color: var(--primary); background: #fff; }
.isbn-input::placeholder { color: #b0c9b8; font-size: 14px; letter-spacing: 0; }

.lookup-btn {
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  white-space: nowrap;
  flex-shrink: 0;
}

.lookup-btn:hover { opacity: 0.85; }
.lookup-btn:active { transform: scale(0.97); }
.lookup-btn:disabled { opacity: 0.4; cursor: default; }

.scan-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  cursor: pointer;
  width: fit-content;
}

.scan-toggle input[type="checkbox"] { display: none; }

.toggle-track {
  width: 42px;
  height: 24px;
  background: #d1e8d9;
  border-radius: 12px;
  position: relative;
  transition: background 0.2s;
  flex-shrink: 0;
}

.scan-toggle input:checked + .toggle-track { background: var(--primary); }

.toggle-thumb {
  width: 18px;
  height: 18px;
  background: white;
  border-radius: 50%;
  position: absolute;
  top: 3px;
  left: 3px;
  transition: left 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}

.scan-toggle input:checked + .toggle-track .toggle-thumb { left: 21px; }

.scan-toggle-label {
  font-size: 13px;
  color: var(--text-sub);
  user-select: none;
}

.scan-badge {
  font-size: 11px;
  background: var(--primary);
  color: white;
  padding: 2px 8px;
  border-radius: 10px;
  display: none;
}

#scanMode:checked ~ .scan-badge { display: inline; }

/* ローディング */
.loading-bar {
  width: 100%;
  height: 3px;
  background: #e6f4ec;
  border-radius: 2px;
  overflow: hidden;
  margin-top: 12px;
  display: none;
}

.loading-bar.active { display: block; }

.loading-bar::after {
  content: '';
  display: block;
  width: 40%;
  height: 100%;
  background: var(--primary);
  border-radius: 2px;
  animation: slide 1s ease infinite;
}

@keyframes slide {
  0% { margin-left: -40%; }
  100% { margin-left: 100%; }
}

/* 本情報プレビュー */
.book-preview {
  border: 2px solid #c3e4ce;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 20px;
  background: #f8fdf9;
  display: none;
}

.book-preview.visible { display: block; }
.book-preview.error { border-color: #fca5a5; background: #fff5f5; }

.preview-inner {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.book-cover {
  width: 80px;
  flex-shrink: 0;
  border-radius: 6px;
  overflow: hidden;
  background: #e6f4ec;
  min-height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}

.book-cover img {
  width: 100%;
  display: block;
}

.book-meta {
  flex: 1;
}

.book-title-input {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  border: none;
  border-bottom: 2px solid #d1e8d9;
  background: transparent;
  width: 100%;
  padding: 2px 4px;
  font-family: 'Noto Sans JP', sans-serif;
  outline: none;
  margin-bottom: 6px;
}

.book-title-input:focus { border-color: var(--primary); }

.meta-row {
  display: flex;
  gap: 8px;
  margin-top: 4px;
  flex-wrap: wrap;
}

.meta-input {
  border: 1.5px solid #d1e8d9;
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12px;
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text-sub);
  background: white;
  outline: none;
  transition: border-color 0.2s;
}

.meta-input:focus { border-color: var(--primary); }
.meta-input.author { flex: 1; min-width: 120px; }
.meta-input.year { width: 80px; }

.isbn-badge {
  font-size: 11px;
  color: #9ab09e;
  margin-top: 6px;
}

/* ステータス選択 */
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 10px;
}

.status-select {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.status-btn {
  flex: 1;
  min-width: 100px;
  padding: 10px 12px;
  border: 2px solid #e5e7eb;
  border-radius: 10px;
  background: white;
  font-size: 13px;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
  color: #9ca3af;
}

.status-btn.owned { border-color: var(--status-owned-bg); }
.status-btn.reading { border-color: var(--status-reading-bg); }
.status-btn.finished { border-color: var(--status-finished-bg); }

.status-btn.owned.selected {
  background: var(--status-owned-bg);
  border-color: var(--status-owned);
  color: var(--status-owned);
}

.status-btn.reading.selected {
  background: var(--status-reading-bg);
  border-color: var(--status-reading);
  color: var(--status-reading);
}

.status-btn.finished.selected {
  background: var(--status-finished-bg);
  border-color: var(--status-finished);
  color: var(--status-finished);
}

/* メモ */
.memo-area {
  width: 100%;
  border: 2px solid #d1e8d9;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text);
  resize: vertical;
  outline: none;
  line-height: 1.7;
  min-height: 80px;
  transition: border-color 0.2s;
  margin-bottom: 20px;
  background: #f8fdf9;
}

.memo-area:focus { border-color: var(--primary); background: #fff; }
.memo-area::placeholder { color: #b0c9b8; }

/* 保存ボタン */
.save-btn {
  width: 100%;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 15px;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}

.save-btn:hover { opacity: 0.85; }
.save-btn:active { transform: scale(0.98); }
.save-btn:disabled { opacity: 0.4; cursor: default; }

/* トースト */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1a2e1a;
  color: white;
  padding: 12px 24px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 700;
  z-index: 1000;
  transition: transform 0.3s ease;
  white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* ===== リストタブ ===== */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 7px 16px;
  border: 2px solid #e5e7eb;
  border-radius: 20px;
  background: white;
  font-size: 13px;
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  color: #9ca3af;
}

.filter-btn.active-all {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
}

.filter-btn.active-owned {
  background: var(--status-owned-bg);
  border-color: var(--status-owned);
  color: var(--status-owned);
}

.filter-btn.active-reading {
  background: var(--status-reading-bg);
  border-color: var(--status-reading);
  color: var(--status-reading);
}

.filter-btn.active-finished {
  background: var(--status-finished-bg);
  border-color: var(--status-finished);
  color: var(--status-finished);
}

.search-input {
  flex: 1;
  min-width: 180px;
  border: 2px solid #d1e8d9;
  border-radius: 20px;
  padding: 7px 16px;
  font-size: 13px;
  font-family: 'Noto Sans JP', sans-serif;
  outline: none;
  color: var(--text);
  transition: border-color 0.2s;
}

.search-input:focus { border-color: var(--primary); }

/* 本カード一覧 */
.book-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.book-card {
  border: 2px solid #e6f4ec;
  border-radius: 14px;
  padding: 16px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  transition: border-color 0.2s, box-shadow 0.2s;
  cursor: pointer;
  background: white;
}

.book-card:hover {
  border-color: var(--primary-mid);
  box-shadow: 0 2px 12px rgba(45,122,79,0.08);
}

.card-cover {
  width: 56px;
  flex-shrink: 0;
  border-radius: 6px;
  overflow: hidden;
  background: #e6f4ec;
  min-height: 78px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}

.card-cover img { width: 100%; display: block; }

.card-body { flex: 1; min-width: 0; }

.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.card-author {
  font-size: 12px;
  color: var(--text-sub);
  margin-bottom: 8px;
}

.card-memo {
  font-size: 12px;
  color: #7a9a7a;
  line-height: 1.5;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  margin-bottom: 8px;
}

.card-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.status-chip {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 10px;
}

.status-chip.owned {
  background: var(--status-owned-bg);
  color: var(--status-owned);
}

.status-chip.reading {
  background: var(--status-reading-bg);
  color: var(--status-reading);
}

.status-chip.finished {
  background: var(--status-finished-bg);
  color: var(--status-finished);
}

.card-isbn {
  font-size: 11px;
  color: #b0c9b8;
}

.card-date {
  font-size: 11px;
  color: #b0c9b8;
  margin-left: auto;
}

.card-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}

.card-edit-btn, .card-del-btn {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s;
}

.card-edit-btn { background: var(--primary-light); }
.card-del-btn { background: #fee2e2; }
.card-edit-btn:hover, .card-del-btn:hover { opacity: 0.75; }

/* 空状態 */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-sub);
}

.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; line-height: 1.8; }

/* 統計カード */
.stats-row {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.stat-card {
  flex: 1;
  background: white;
  border: 2px solid #e6f4ec;
  border-radius: 12px;
  padding: 14px 10px;
  text-align: center;
}

.stat-card .num {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 4px;
}

.stat-card .lbl {
  font-size: 11px;
  color: var(--text-sub);
}

.stat-card.owned .num { color: var(--status-owned); }
.stat-card.reading .num { color: var(--status-reading); }
.stat-card.finished .num { color: var(--status-finished); }

/* モーダル（編集） */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  display: none;
}

.modal-overlay.open { display: flex; }

.modal {
  background: white;
  border-radius: var(--radius);
  padding: 24px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.2);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.modal-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.modal-close {
  background: #f3f4f6;
  border: none;
  border-radius: 8px;
  width: 32px;
  height: 32px;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close:hover { background: #e5e7eb; }

@media (max-width: 500px) {
  body { padding: 10px; }
  .card { padding: 16px; }
  .stats-row { gap: 6px; }
  .stat-card { padding: 10px 6px; }
  .stat-card .num { font-size: 20px; }
}
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <div class="header-icon">📚</div>
  <div>
    <div class="header-title">読書記録</div>
    <div class="header-sub">本の記録・感想・読了管理</div>
  </div>
  <div class="header-stats" id="headerStats">
    <div class="stat-num" id="totalCount">0</div>
    <div class="stat-label">冊登録</div>
  </div>
</div>

<!-- タブ -->
<div class="tabs">
  <button class="tab active" onclick="showTab('add')" id="tab-add">➕ 本を追加</button>
  <button class="tab" onclick="showTab('list')" id="tab-list">📋 本のリスト</button>
</div>

<!-- 追加タブ -->
<div class="card" id="panel-add">
  <!-- ISBN入力 -->
  <div class="isbn-section">
    <label>ISBN コード（10桁 / 13桁）</label>
    <div class="isbn-row">
      <input class="isbn-input" type="text" id="isbnInput"
        placeholder="例：9784088820750"
        inputmode="numeric"
        maxlength="17"
        onkeydown="handleIsbnKey(event)"
        oninput="formatIsbnInput(this)" />
      <button class="lookup-btn" id="lookupBtn" onclick="lookupISBN()">🔍 検索</button>
    </div>
    <label class="scan-toggle" for="scanMode">
      <input type="checkbox" id="scanMode" onchange="updateScanMode()">
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
      <span class="scan-toggle-label">連続スキャンモード</span>
    </label>
    <div class="loading-bar" id="loadingBar"></div>
  </div>

  <!-- 書誌情報プレビュー -->
  <div class="book-preview" id="bookPreview">
    <div class="preview-inner">
      <div class="book-cover" id="coverBox">📖</div>
      <div class="book-meta">
        <input class="book-title-input" type="text" id="previewTitle" placeholder="タイトル" />
        <div class="meta-row">
          <input class="meta-input author" type="text" id="previewAuthor" placeholder="著者" />
          <input class="meta-input year" type="text" id="previewYear" placeholder="出版年" maxlength="4" />
        </div>
        <div class="isbn-badge" id="previewIsbn"></div>
      </div>
    </div>
  </div>

  <!-- ステータス -->
  <div class="section-title">読書ステータス</div>
  <div class="status-select" id="statusSelect">
    <button class="status-btn owned selected" onclick="selectStatus('owned')">📦 持っている</button>
    <button class="status-btn reading" onclick="selectStatus('reading')">📖 読んでいる</button>
    <button class="status-btn finished" onclick="selectStatus('finished')">✅ 読了</button>
  </div>

  <!-- メモ -->
  <div class="section-title">メモ・感想</div>
  <textarea class="memo-area" id="memoArea" rows="3"
    placeholder="感想、気になったフレーズ、おすすめポイントなど…"></textarea>

  <!-- 保存 -->
  <button class="save-btn" id="saveBtn" onclick="saveBook()">💾 登録する</button>
</div>

<!-- リストタブ -->
<div class="card" id="panel-list" style="display:none;">
  <!-- 統計 -->
  <div class="stats-row">
    <div class="stat-card owned">
      <div class="num" id="statOwned">0</div>
      <div class="lbl">📦 所持</div>
    </div>
    <div class="stat-card reading">
      <div class="num" id="statReading">0</div>
      <div class="lbl">📖 読書中</div>
    </div>
    <div class="stat-card finished">
      <div class="num" id="statFinished">0</div>
      <div class="lbl">✅ 読了</div>
    </div>
  </div>

  <!-- フィルタ・検索 -->
  <div class="filter-bar">
    <button class="filter-btn active-all" onclick="setFilter('all')" id="filter-all">すべて</button>
    <button class="filter-btn" onclick="setFilter('owned')" id="filter-owned">📦 所持</button>
    <button class="filter-btn" onclick="setFilter('reading')" id="filter-reading">📖 読書中</button>
    <button class="filter-btn" onclick="setFilter('finished')" id="filter-finished">✅ 読了</button>
    <input class="search-input" type="text" id="searchInput"
      placeholder="タイトル・著者で検索"
      oninput="renderList()" />
  </div>

  <!-- 本リスト -->
  <div class="book-list" id="bookList"></div>
</div>

<!-- トースト -->
<div class="toast" id="toast"></div>

<!-- 編集モーダル -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">✏️ 編集</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <input type="hidden" id="editId" />

    <div class="section-title" style="margin-bottom:8px;">タイトル</div>
    <input class="book-title-input" type="text" id="editTitle"
      style="width:100%;border:2px solid #d1e8d9;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:15px;outline:none;"
      onfocus="this.style.borderColor='var(--primary)'"
      onblur="this.style.borderColor='#d1e8d9'" />

    <div class="meta-row" style="margin-bottom:14px;">
      <input class="meta-input author" type="text" id="editAuthor"
        placeholder="著者" style="font-size:13px;padding:8px 12px;" />
      <input class="meta-input year" type="text" id="editYear"
        placeholder="出版年" style="font-size:13px;padding:8px 12px;" />
    </div>

    <div class="section-title" style="margin-bottom:8px;">ステータス</div>
    <div class="status-select" id="editStatusSelect" style="margin-bottom:14px;">
      <button class="status-btn owned" onclick="selectEditStatus('owned')">📦 所持</button>
      <button class="status-btn reading" onclick="selectEditStatus('reading')">📖 読書中</button>
      <button class="status-btn finished" onclick="selectEditStatus('finished')">✅ 読了</button>
    </div>

    <div class="section-title" style="margin-bottom:8px;">メモ・感想</div>
    <textarea class="memo-area" id="editMemo" rows="4" style="margin-bottom:20px;"
      placeholder="感想、気になったフレーズなど…"></textarea>

    <button class="save-btn" onclick="saveEdit()">✅ 保存する</button>
  </div>
</div>

<script>
// ===== データ管理 =====
const STORAGE_KEY = 'book_tracker_v1';

function loadBooks() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch { return []; }
}

function saveBooks(books) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
}

// ===== 状態 =====
let currentStatus = 'owned';
let currentFilter = 'all';
let editStatus = 'owned';
let pendingIsbn = '';

// ===== タブ切替 =====
function showTab(tab) {
  document.getElementById('panel-add').style.display = tab === 'add' ? 'block' : 'none';
  document.getElementById('panel-list').style.display = tab === 'list' ? 'block' : 'none';
  document.getElementById('tab-add').className = 'tab' + (tab === 'add' ? ' active' : '');
  document.getElementById('tab-list').className = 'tab' + (tab === 'list' ? ' active' : '');
  if (tab === 'list') renderList();
}

// ===== ISBN フォーマット =====
function formatIsbnInput(el) {
  el.value = el.value.replace(/[^\d\-]/g, '');
}

function cleanIsbn(raw) {
  return raw.replace(/[\-\s]/g, '').trim();
}

function handleIsbnKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    lookupISBN();
  }
}

// ===== ISBN 検索 =====
async function lookupISBN() {
  const raw = document.getElementById('isbnInput').value;
  const isbn = cleanIsbn(raw);

  if (isbn.length !== 10 && isbn.length !== 13) {
    showToast('⚠️ ISBNは10桁または13桁で入力してください');
    return;
  }

  const isbn13 = isbn.length === 10 ? isbn10to13(isbn) : isbn;
  pendingIsbn = isbn13;

  setLoading(true);

  let book = null;

  // Google Books API
  try {
    const res = await fetch(
      `https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}&maxResults=1`
    );
    if (res.ok) {
      const data = await res.json();
      if (data.totalItems > 0) {
        const info = data.items[0].volumeInfo;
        book = {
          title: info.title || '',
          authors: (info.authors || []).join('、'),
          year: (info.publishedDate || '').slice(0, 4),
          thumbnail: info.imageLinks?.thumbnail?.replace('http:', 'https:') || '',
        };
      }
    }
  } catch (e) { /* fallback */ }

  // OpenLibrary fallback
  if (!book) {
    try {
      const res = await fetch(
        `https://openlibrary.org/api/books?bibkeys=ISBN:${isbn13}&format=json&jscmd=data`
      );
      if (res.ok) {
        const data = await res.json();
        const key = `ISBN:${isbn13}`;
        if (data[key]) {
          const info = data[key];
          book = {
            title: info.title || '',
            authors: (info.authors || []).map(a => a.name).join('、'),
            year: (info.publish_date || '').replace(/.*(\d{4}).*/, '$1'),
            thumbnail: info.cover?.large || info.cover?.medium || '',
          };
        }
      }
    } catch (e) { /* not found */ }
  }

  setLoading(false);

  if (!book) {
    showPreview(null, isbn13);
    showToast('⚠️ 書誌情報が見つかりませんでした。手動で入力してください');
    return;
  }

  showPreview(book, isbn13);
  showToast('✅ 書誌情報を取得しました');
}

function isbn10to13(isbn10) {
  const base = '978' + isbn10.slice(0, 9);
  let sum = 0;
  for (let i = 0; i < 12; i++) {
    sum += parseInt(base[i]) * (i % 2 === 0 ? 1 : 3);
  }
  const check = (10 - (sum % 10)) % 10;
  return base + check;
}

function showPreview(book, isbn) {
  const preview = document.getElementById('bookPreview');
  preview.classList.add('visible');
  preview.classList.remove('error');

  if (book) {
    document.getElementById('previewTitle').value = book.title;
    document.getElementById('previewAuthor').value = book.authors;
    document.getElementById('previewYear').value = book.year;

    const coverBox = document.getElementById('coverBox');
    if (book.thumbnail) {
      coverBox.innerHTML = `<img src="${book.thumbnail}" alt="表紙" onerror="this.parentNode.textContent='📖'">`;
    } else {
      coverBox.textContent = '📖';
    }
  } else {
    document.getElementById('previewTitle').value = '';
    document.getElementById('previewAuthor').value = '';
    document.getElementById('previewYear').value = '';
    document.getElementById('coverBox').textContent = '📖';
    preview.classList.add('error');
  }

  document.getElementById('previewIsbn').textContent = `ISBN: ${isbn}`;
}

function setLoading(on) {
  document.getElementById('loadingBar').className = 'loading-bar' + (on ? ' active' : '');
  document.getElementById('lookupBtn').disabled = on;
}

// ===== ステータス選択 =====
function selectStatus(s) {
  currentStatus = s;
  document.querySelectorAll('#statusSelect .status-btn').forEach(btn => btn.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
}

function selectEditStatus(s) {
  editStatus = s;
  document.querySelectorAll('#editStatusSelect .status-btn').forEach(btn => btn.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
}

// ===== スキャンモード =====
function updateScanMode() {
  const on = document.getElementById('scanMode').checked;
  if (on) showToast('🔄 連続スキャンモード ON — 登録後に自動で次の入力へ');
}

// ===== 本を保存 =====
function saveBook() {
  const title = document.getElementById('previewTitle').value.trim();
  const author = document.getElementById('previewAuthor').value.trim();
  const year = document.getElementById('previewYear').value.trim();
  const memo = document.getElementById('memoArea').value.trim();
  const isbn = pendingIsbn;
  const thumbnail = document.getElementById('coverBox').querySelector('img')?.src || '';

  if (!title) {
    showToast('⚠️ まずISBNを検索するか、タイトルを入力してください');
    return;
  }

  const books = loadBooks();

  // 重複チェック
  if (isbn && books.some(b => b.isbn === isbn)) {
    showToast('⚠️ この本はすでに登録されています');
    return;
  }

  const book = {
    id: Date.now(),
    isbn,
    title,
    authors: author,
    year,
    thumbnail,
    status: currentStatus,
    memo,
    addedAt: new Date().toISOString(),
  };

  books.unshift(book);
  saveBooks(books);
  updateStats();
  showToast('✅ 登録しました：' + title);

  const scanMode = document.getElementById('scanMode').checked;

  // フォームリセット
  document.getElementById('isbnInput').value = '';
  document.getElementById('bookPreview').classList.remove('visible', 'error');
  document.getElementById('previewTitle').value = '';
  document.getElementById('previewAuthor').value = '';
  document.getElementById('previewYear').value = '';
  document.getElementById('coverBox').textContent = '📖';
  document.getElementById('previewIsbn').textContent = '';
  document.getElementById('memoArea').value = '';
  pendingIsbn = '';

  // ステータスを「所持」に戻す
  currentStatus = 'owned';
  document.querySelectorAll('#statusSelect .status-btn').forEach(btn => btn.classList.remove('selected'));
  document.querySelector('#statusSelect .status-btn.owned').classList.add('selected');

  if (scanMode) {
    setTimeout(() => document.getElementById('isbnInput').focus(), 100);
  }
}

// ===== リスト表示 =====
function setFilter(f) {
  currentFilter = f;
  ['all','owned','reading','finished'].forEach(id => {
    const btn = document.getElementById('filter-' + id);
    btn.className = 'filter-btn' + (id === f ? ` active-${id}` : '');
  });
  renderList();
}

function renderList() {
  const books = loadBooks();
  const search = document.getElementById('searchInput').value.trim().toLowerCase();

  let filtered = books.filter(b => {
    if (currentFilter !== 'all' && b.status !== currentFilter) return false;
    if (search) {
      const hay = (b.title + b.authors).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  const container = document.getElementById('bookList');

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <p>${books.length === 0
          ? '本がまだ登録されていません。\n「本を追加」タブでISBNを入力して登録しましょう！'
          : '該当する本が見つかりませんでした。'
        }</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(b => {
    const statusLabel = { owned: '📦 所持', reading: '📖 読書中', finished: '✅ 読了' }[b.status] || '';
    const addedDate = b.addedAt ? new Date(b.addedAt).toLocaleDateString('ja-JP', { year:'numeric', month:'short', day:'numeric' }) : '';
    const coverHtml = b.thumbnail
      ? `<img src="${b.thumbnail}" alt="表紙" onerror="this.parentNode.textContent='📖'">`
      : '📖';

    return `
      <div class="book-card" onclick="openEdit(${b.id})">
        <div class="card-cover">${coverHtml}</div>
        <div class="card-body">
          <div class="card-title">${escHtml(b.title)}</div>
          <div class="card-author">${escHtml(b.authors || '')}${b.year ? `　${escHtml(b.year)}` : ''}</div>
          ${b.memo ? `<div class="card-memo">${escHtml(b.memo)}</div>` : ''}
          <div class="card-footer">
            <span class="status-chip ${b.status}">${statusLabel}</span>
            ${b.isbn ? `<span class="card-isbn">${b.isbn}</span>` : ''}
            <span class="card-date">${addedDate}</span>
          </div>
        </div>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="card-edit-btn" onclick="openEdit(${b.id})" title="編集">✏️</button>
          <button class="card-del-btn" onclick="deleteBook(${b.id})" title="削除">🗑️</button>
        </div>
      </div>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== 統計更新 =====
function updateStats() {
  const books = loadBooks();
  const owned = books.filter(b => b.status === 'owned').length;
  const reading = books.filter(b => b.status === 'reading').length;
  const finished = books.filter(b => b.status === 'finished').length;

  document.getElementById('totalCount').textContent = books.length;
  document.getElementById('statOwned').textContent = owned;
  document.getElementById('statReading').textContent = reading;
  document.getElementById('statFinished').textContent = finished;
}

// ===== 編集モーダル =====
function openEdit(id) {
  const books = loadBooks();
  const book = books.find(b => b.id === id);
  if (!book) return;

  document.getElementById('editId').value = id;
  document.getElementById('editTitle').value = book.title;
  document.getElementById('editAuthor').value = book.authors || '';
  document.getElementById('editYear').value = book.year || '';
  document.getElementById('editMemo').value = book.memo || '';

  editStatus = book.status || 'owned';
  document.querySelectorAll('#editStatusSelect .status-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.classList.contains(editStatus));
  });

  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
}

function saveEdit() {
  const id = parseInt(document.getElementById('editId').value);
  const books = loadBooks();
  const idx = books.findIndex(b => b.id === id);
  if (idx === -1) return;

  books[idx].title = document.getElementById('editTitle').value.trim();
  books[idx].authors = document.getElementById('editAuthor').value.trim();
  books[idx].year = document.getElementById('editYear').value.trim();
  books[idx].memo = document.getElementById('editMemo').value.trim();
  books[idx].status = editStatus;

  saveBooks(books);
  updateStats();
  closeModal();
  renderList();
  showToast('✅ 更新しました');
}

// ===== 削除 =====
function deleteBook(id) {
  const books = loadBooks();
  const book = books.find(b => b.id === id);
  if (!book) return;
  if (!confirm(`「${book.title}」を削除しますか？`)) return;

  saveBooks(books.filter(b => b.id !== id));
  updateStats();
  renderList();
  showToast('🗑️ 削除しました');
}

// ===== トースト =====
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ===== モーダル外クリックで閉じる =====
document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ===== 初期化 =====
updateStats();
</script>
</body>
</html>
